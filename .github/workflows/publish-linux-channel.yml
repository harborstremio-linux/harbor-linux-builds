name: Publish Harbor Linux Channel

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact Harbor commit or ref to build.
        required: true
        type: string
      tag:
        description: GitHub release tag to create or update.
        required: true
        type: string
      version:
        description: Harbor package version.
        required: true
        type: string
      channel:
        description: Package channel.
        required: true
        type: string
      aur_package:
        description: AUR package name for this channel.
        required: true
        type: string
      target:
        description: "Build target: all, native, deb, rpm, flatpak, or appimage."
        required: false
        default: all
        type: string

permissions:
  # Reusable Flatpak/AppImage workflows declare optional release-publish jobs.
  # GitHub validates their maximum permission at this workflow boundary, even
  # when this workflow invokes only their build jobs.
  contents: write

concurrency:
  group: harbor-linux-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  ensure-release:
    name: Ensure GitHub release exists
    needs: build
    if: always() && (needs.build.result == 'success' || inputs.target == 'flatpak' || inputs.target == 'appimage')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Create release when needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then exit 0; fi
          if [ "${TARGET}" = flatpak ] || [ "${TARGET}" = appimage ]; then
            echo "Target ${TARGET} attaches assets to an existing release; ${TAG} does not exist." >&2
            exit 1
          fi
          notes="Unofficial ${CHANNEL} Linux build of Harbor.\n\nSource: https://github.com/harborstremio/harbor/tree/${SOURCE_REF}\n\nThese binaries are built by this repository's GitHub Actions workflow, not by upstream Harbor."
          if [ "${CHANNEL}" = beta ]; then
            gh release create "${TAG}" --repo "${REPOSITORY}" --title "Harbor Linux ${TAG}" --notes "${notes}" --prerelease
          else
            gh release create "${TAG}" --repo "${REPOSITORY}" --title "Harbor Linux ${TAG}" --notes "${notes}" --latest
          fi

  build:
    name: Build Linux bundles
    if: inputs.target == 'all' || inputs.target == 'native' || inputs.target == 'deb' || inputs.target == 'rpm'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Harbor build
        uses: ./.github/actions/setup-harbor-linux
        with:
          source_ref: ${{ inputs.source_ref }}
          include_rpm_tooling: "true"

      - name: Disable updater artifacts
        working-directory: harbor
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.createUpdaterArtifacts = false;

          if (process.env.CHANNEL === "beta") {
            // This changes Linux package identity only. Keep the Tauri
            // identifier untouched so beta/stable use the same Harbor data.
            config.productName = "Harbor Beta";
            config.bundle.linux ??= {};
            config.bundle.linux.deb ??= {};
            config.bundle.linux.rpm ??= {};
            config.bundle.linux.deb.conflicts = ["harbor"];
            config.bundle.linux.deb.replaces = ["harbor"];
            config.bundle.linux.rpm.conflicts = ["harbor"];
            config.bundle.linux.rpm.obsoletes = ["harbor"];
          }

          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          EOF

      - name: Build Debian bundle
        if: inputs.target == 'all' || inputs.target == 'native' || inputs.target == 'deb'
        working-directory: harbor
        run: pnpm tauri build --config src-tauri/tauri.linux-system.conf.json --target x86_64-unknown-linux-gnu --bundles deb

      - name: Build RPM bundle
        if: inputs.target == 'all' || inputs.target == 'native' || inputs.target == 'rpm'
        working-directory: harbor
        run: pnpm tauri build --config src-tauri/tauri.linux-system.conf.json --target x86_64-unknown-linux-gnu --bundles rpm

      - name: Validate Linux library ABI
        env:
          CHANNEL: ${{ inputs.channel }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "${TARGET}" != rpm ]; then
            deb="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -type f -name '*.deb' | head -n 1)"
            test -n "${deb}" || { echo "No Debian bundle was produced" >&2; exit 1; }
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "${tmpdir}"' EXIT
            dpkg-deb -x "${deb}" "${tmpdir}"
            readelf -d "${tmpdir}/usr/bin/harbor" | grep 'Shared library: \[libmpv.so.2\]'
            if readelf -d "${tmpdir}/usr/bin/harbor" | grep -q 'Shared library: \[libmpv.so.1\]'; then exit 1; fi
          fi
          if [ "${CHANNEL}" = beta ] && [ "${TARGET}" != rpm ]; then
            test "$(dpkg-deb -f "${deb}" Package)" = harbor-beta
            dpkg-deb -f "${deb}" Conflicts | grep -Fx harbor
            dpkg-deb -f "${deb}" Replaces | grep -Fx harbor
          fi
          if [ "${CHANNEL}" = beta ] && [ "${TARGET}" != deb ]; then
            rpm="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm -type f -name '*.rpm' | head -n 1)"
            test -n "${rpm}" || { echo "No RPM bundle was produced" >&2; exit 1; }
            test "$(rpm -qp --qf '%{NAME}' "${rpm}")" = harbor-beta
            rpm -qp --conflicts "${rpm}" | grep -Fx harbor
            rpm -qp --obsoletes "${rpm}" | grep -Fx harbor
          fi

      - name: Collect artifacts
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${TARGET}" != rpm ]; then
            deb="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -type f -name '*.deb' | head -n 1)"
            test -n "${deb}" || { echo "No Debian bundle was produced" >&2; exit 1; }
            cp -v "${deb}" "dist/Harbor_${VERSION}_amd64.deb"
          fi
          if [ "${TARGET}" != deb ]; then
            rpm="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm -type f -name '*.rpm' | head -n 1)"
            test -n "${rpm}" || { echo "No RPM bundle was produced" >&2; exit 1; }
            cp -v "${rpm}" "dist/Harbor-${VERSION}-1.x86_64.rpm"
          fi
          cd dist
          sha256sum ./* | sed 's#  \./#  #' > "SHA256SUMS-${VERSION}.txt"
          ls -lh

      - name: Upload Linux bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-bundles-${{ inputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish Linux bundles
    needs: [ensure-release, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bundles-${{ inputs.version }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          checksums="SHA256SUMS-${VERSION}.txt"
          previous_dir="$(mktemp -d)"
          trap 'rm -rf "${previous_dir}"' EXIT
          shopt -s nullglob
          assets=(dist/*.deb dist/*.rpm)
          names=()
          for asset_path in "${assets[@]}"; do names+=("$(basename "${asset_path}")"); done
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern "${checksums}" --dir "${previous_dir}" || true
          gh release upload "${TAG}" "${assets[@]}" --repo "${REPOSITORY}" --clobber

          # Preserve prior checksums only for assets still attached to this
          # release, then replace the core-package lines with fresh hashes.
          # This transfers only the small manifest, not the Flatpak/AppImage.
          gh release view "${TAG}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name' > "${previous_dir}/assets.txt"
          {
            if [ -f "${previous_dir}/${checksums}" ]; then
              while IFS= read -r entry; do
                if [[ ! "${entry}" =~ ^[[:xdigit:]]{64}\ \ .+ ]]; then
                  continue
                fi
                asset="${entry#*  }"
                if [ "${asset}" = "${checksums}" ]; then continue; fi
                for current_asset in "${names[@]}"; do [ "${asset}" = "${current_asset}" ] && continue 2; done
                if grep -Fxq -- "${asset}" "${previous_dir}/assets.txt"; then
                  printf '%s\n' "${entry}"
                fi
              done < "${previous_dir}/${checksums}"
            fi
            (
              cd dist
              sha256sum "${names[@]}"
            )
          } | sort -k 2,2 > "dist/${checksums}"
          gh release upload "${TAG}" "dist/${checksums}" --repo "${REPOSITORY}" --clobber

      - name: Verify published Debian asset
        if: inputs.target != 'rpm'
        id: published_deb
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DEB_ASSET: Harbor_${{ inputs.version }}_amd64.deb
        run: |
          set -euo pipefail
          expected_sha256="$(sha256sum "dist/${DEB_ASSET}" | awk '{print $1}')"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern "${DEB_ASSET}" --dir "${tmpdir}"
          published_sha256="$(sha256sum "${tmpdir}/${DEB_ASSET}" | awk '{print $1}')"
          test "${published_sha256}" = "${expected_sha256}"
          echo "sha256=${published_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Update AUR package
        if: inputs.target != 'rpm'
        uses: ./.github/actions/publish-aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        with:
          version: ${{ inputs.version }}
          tag: ${{ inputs.tag }}
          channel: ${{ inputs.channel }}
          package: ${{ inputs.aur_package }}
          deb_asset: Harbor_${{ inputs.version }}_amd64.deb
          deb_sha256: ${{ steps.published_deb.outputs.sha256 }}
          repository: ${{ github.repository }}

  flatpak:
    name: Build Flatpak bundle
    needs: ensure-release
    if: inputs.target == 'all' || inputs.target == 'flatpak'
    uses: ./.github/workflows/build-flatpak.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      tag: ${{ inputs.tag }}
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}

  publish-flatpak:
    name: Publish Flatpak bundle
    needs: [ensure-release, flatpak]
    if: inputs.target == 'all' || inputs.target == 'flatpak'
    runs-on: ubuntu-24.04
    concurrency:
      group: harbor-release-assets-${{ inputs.tag }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Flatpak bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-bundle-${{ inputs.version }}
          path: dist
      - name: Download refreshed Flatpak sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-sources-${{ inputs.version }}
          path: flatpak-artifact
      - name: Persist downstream Flatpak sources
        run: |
          set -euo pipefail
          rsync -a --delete flatpak-artifact/ flatpak/
          git add flatpak
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Aditya Hebballe"
          git config user.email "45328110+AdityaHebballe@users.noreply.github.com"
          git commit -m "build(flatpak): sync ${{ inputs.version }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish Flatpak bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          asset="Harbor_${VERSION}_x86_64.flatpak"
          checksums="SHA256SUMS-${VERSION}.txt"
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern "${checksums}" --dir dist
          tmpfile="$(mktemp)"
          trap 'rm -f "${tmpfile}"' EXIT
          grep -v -F "  ${asset}" "dist/${checksums}" > "${tmpfile}" || true
          sha256sum "dist/${asset}" >> "${tmpfile}"
          sort -k 2,2 "${tmpfile}" > "dist/${checksums}"
          gh release upload "${TAG}" dist/* --repo "${REPOSITORY}" --clobber

  appimage:
    name: Build experimental AppImage
    needs: ensure-release
    if: inputs.target == 'all' || inputs.target == 'appimage'
    uses: ./.github/workflows/build-appimage.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      tag: ${{ inputs.tag }}
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}

  publish-appimage:
    name: Publish experimental AppImage
    needs: [ensure-release, appimage]
    if: inputs.target == 'all' || inputs.target == 'appimage'
    runs-on: ubuntu-24.04
    concurrency:
      group: harbor-release-assets-${{ inputs.tag }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage-${{ inputs.version }}
          path: dist
      - name: Append AppImage checksums and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          checksums="SHA256SUMS-${VERSION}.txt"
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern "${checksums}" --dir dist
          tmpfile="$(mktemp)"
          trap 'rm -f "${tmpfile}"' EXIT
          grep -v -E '  Harbor_.*_amd64\.AppImage(\.zsync)?$' "dist/${checksums}" > "${tmpfile}" || true
          sha256sum dist/*.AppImage dist/*.AppImage.zsync >> "${tmpfile}"
          sort -k 2,2 "${tmpfile}" > "dist/${checksums}"
          gh release upload "${TAG}" dist/*.AppImage dist/*.AppImage.zsync "dist/${checksums}" --repo "${REPOSITORY}" --clobber
