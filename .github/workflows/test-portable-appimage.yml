name: Test Harbor portable AppImage

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Harbor commit or ref to build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build experimental portable AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Resolve upstream source ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_ref="$(gh api "repos/harborstremio/harbor/commits/${INPUT_SOURCE_REF}" --jq '.sha')"
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout packaging workflow
        uses: actions/checkout@v7.0.0

      - name: Set up Harbor build
        uses: ./.github/actions/setup-harbor-linux
        with:
          source_ref: ${{ steps.source.outputs.source_ref }}
          include_gstreamer: "true"

      - name: Install experimental Tauri bundler
        run: |
          set -euo pipefail
          cargo install tauri-cli \
            --git https://github.com/tauri-apps/tauri \
            --rev 162626969b382d52faebdf6c7264460bd9a47d1f \
            --locked \
            --root "${RUNNER_TEMP}/tauri-cli"
          echo "${RUNNER_TEMP}/tauri-cli/bin" >> "${GITHUB_PATH}"

      - name: Disable updater artifacts
        working-directory: harbor
        run: |
          node -e '
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          '

      - name: Build portable AppImage
        working-directory: harbor
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
          # quick-sharun defaults to a very slow archival compression profile.
          # This is an experiment artifact, so prioritize a bounded CI build.
          DWARFS_COMP: "zstd:level=8 -S22 -B6"
        run: timeout --signal=TERM 45m cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Collect AppImage artifact
        run: |
          set -euo pipefail
          appimage="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "${appimage}"
          mkdir dist
          cp "${appimage}" dist/
          sha256sum dist/*.AppImage > dist/SHA256SUMS

      - name: Upload experimental artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: portable-appimage-${{ steps.source.outputs.source_ref }}
          path: dist/
          if-no-files-found: error
