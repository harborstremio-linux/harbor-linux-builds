name: Build Harbor AppImage

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Harbor commit or ref to build.
        required: true
        type: string
      tag:
        description: Existing release tag to receive the AppImage.
        required: true
        type: string
      version:
        description: Harbor package version. Leave blank to read it from the source ref.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: harbor-appimage-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Verify target release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null

      - name: Resolve upstream source ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_ref="$(gh api "repos/harborstremio/harbor/commits/${INPUT_SOURCE_REF}" --jq '.sha')"
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Harbor
        uses: actions/checkout@v7.0.0
        with:
          repository: harborstremio/harbor
          ref: ${{ steps.source.outputs.source_ref }}
          path: harbor

      - name: Resolve package version
        id: package
        working-directory: harbor
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          if [ -z "${version}" ]; then
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify AppImage media framework configuration
        working-directory: harbor
        run: |
          node -e '
          const config = require("./src-tauri/tauri.conf.json");
          if (config.bundle?.linux?.appimage?.bundleMediaFramework !== true) {
            throw new Error("The selected Harbor source does not enable AppImage media-framework bundling.");
          }
          '

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            ffmpeg \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            yt-dlp

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Install Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harbor/pnpm-lock.yaml

      - name: Prepare AppImage build
        working-directory: harbor
        run: |
          set -euo pipefail

          node <<'EOF'
          const fs = require('fs');
          const tauriConfigPath = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(tauriConfigPath, 'utf8'));
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(tauriConfigPath, `${JSON.stringify(config, null, 2)}\n`);

          const workspacePath = 'pnpm-workspace.yaml';
          let workspace = fs.existsSync(workspacePath)
            ? fs.readFileSync(workspacePath, 'utf8')
            : '';
          const setAllowBuild = (name, value) => {
            const entry = new RegExp(`^(\\s*)${name}:.*$`, 'm');
            if (entry.test(workspace)) {
              workspace = workspace.replace(entry, `$1${name}: ${value}`);
              return;
            }
            if (/^allowBuilds:\s*$/m.test(workspace)) {
              workspace = workspace.replace(/^allowBuilds:\s*$/m, `allowBuilds:\n  ${name}: ${value}`);
              return;
            }
            workspace += `${workspace.endsWith('\n') || !workspace ? '' : '\n'}allowBuilds:\n  ${name}: ${value}\n`;
          };
          setAllowBuild('esbuild', 'true');
          setAllowBuild('protobufjs', 'false');
          fs.writeFileSync(workspacePath, workspace);
          EOF

      - name: Install JavaScript dependencies
        working-directory: harbor
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Fetch bundled build assets
        working-directory: harbor
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.setup ? 0 : 1)"; then
            pnpm run setup
          else
            if node -e "process.exit(require('./package.json').scripts?.['setup:fonts'] ? 0 : 1)"; then
              pnpm run setup:fonts
            fi
            mkdir -p src-tauri/binaries
            ln -sf /usr/bin/ffmpeg src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
            ln -sf /usr/bin/ffprobe src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
            ln -sf /usr/bin/yt-dlp src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu
          fi

      - name: Build AppImage
        working-directory: harbor
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Validate AppImage media framework
        run: |
          set -euo pipefail

          appimage="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)"
          if [ -z "${appimage}" ]; then
            echo "No AppImage bundle was produced" >&2
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT
          (
            cd "${tmpdir}"
            "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null
          )
          test -f "${tmpdir}/squashfs-root/usr/lib/gstreamer-1.0/libgstapp.so"
          test -f "${tmpdir}/squashfs-root/usr/lib/gstreamer-1.0/libgstautodetect.so"
          test -x "${tmpdir}/squashfs-root/usr/libexec/gstreamer-1.0/gst-plugin-scanner"

      - name: Attach AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          appimage="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)"
          if [ -z "${appimage}" ]; then
            echo "No AppImage bundle was produced" >&2
            exit 1
          fi
          asset="Harbor_${VERSION}_x86_64.AppImage"
          cp "${appimage}" "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"
          gh release upload "${TAG}" "${asset}" "${asset}.sha256" --repo "${REPOSITORY}" --clobber
