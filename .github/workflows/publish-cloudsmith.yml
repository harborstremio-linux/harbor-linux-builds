name: Publish Linux Packages to Cloudsmith

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag containing the Debian package.
        required: true
        default: beta-v0.9.124
        type: string
      version:
        description: Harbor package version to publish.
        required: true
        default: 0.9.124
        type: string
      package_revision:
        description: Native package revision (Debian revision and RPM release).
        required: false
        default: "1"
        type: string
      cloudsmith_repository:
        description: Cloudsmith owner/repository slug.
        required: true
        default: harborstremio/harbor-beta
        type: string

permissions:
  contents: read

concurrency:
  group: cloudsmith-${{ inputs.cloudsmith_repository }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish beta Linux packages
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Download and verify GitHub Release packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          PACKAGE_REVISION: ${{ inputs.package_revision || '1' }}
        run: |
          set -euo pipefail
          checksums="SHA256SUMS-${VERSION}.txt"
          deb_asset="Harbor_${VERSION}-${PACKAGE_REVISION}_amd64.deb"
          rpm_asset="Harbor-${VERSION}-${PACKAGE_REVISION}.x86_64.rpm"
          mkdir dist
          gh release download "${TAG}" --repo "${REPOSITORY}" \
            --pattern "${deb_asset}" \
            --pattern "${rpm_asset}" \
            --pattern "${checksums}" \
            --dir dist
          (
            cd dist
            grep -F -e "  ${deb_asset}" -e "  ${rpm_asset}" "${checksums}" | sha256sum --check --strict
          )

      - name: Install Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3.1.1
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Publish verified Debian package
        env:
          CLOUDSMITH_REPOSITORY: ${{ inputs.cloudsmith_repository }}
          VERSION: ${{ inputs.version }}
          PACKAGE_REVISION: ${{ inputs.package_revision || '1' }}
        run: |
          set -euo pipefail
          cloudsmith push deb "${CLOUDSMITH_REPOSITORY}/ubuntu/noble" \
            "dist/Harbor_${VERSION}-${PACKAGE_REVISION}_amd64.deb" \
            --republish \
            --tags beta

      - name: Publish verified RPM package
        env:
          CLOUDSMITH_REPOSITORY: ${{ inputs.cloudsmith_repository }}
          RPM_DISTRIBUTION: ${{ vars.CLOUDSMITH_BETA_RPM_DISTRIBUTION || 'fedora/44' }}
          VERSION: ${{ inputs.version }}
          PACKAGE_REVISION: ${{ inputs.package_revision || '1' }}
        run: |
          set -euo pipefail
          test -n "${RPM_DISTRIBUTION}"
          cloudsmith push rpm "${CLOUDSMITH_REPOSITORY}/${RPM_DISTRIBUTION}" \
            "dist/Harbor-${VERSION}-${PACKAGE_REVISION}.x86_64.rpm" \
            --republish \
            --tags beta
