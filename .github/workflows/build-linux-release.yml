name: Build Harbor Linux Release

on:
  workflow_call:
    inputs:
      source_ref:
        description: Harbor commit or ref to build.
        required: true
        type: string
      tag:
        description: Release tag to create in this repository.
        required: true
        type: string
      version:
        description: Harbor package version.
        required: true
        type: string
      channel:
        description: Package channel.
        required: false
        default: stable
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream Harbor tag to build, for example v0.9.12. Leave empty for latest release.
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: harbor-linux-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve upstream tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      channel: ${{ steps.resolve.outputs.channel }}
      aur_package: ${{ steps.resolve.outputs.aur_package }}
      contains_linux_fix: ${{ steps.resolve.outputs.contains_linux_fix }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_SOURCE_REF}" ]; then
            tag="${INPUT_TAG}"
            version="${INPUT_VERSION}"
            source_ref="${INPUT_SOURCE_REF}"
            contains_linux_fix=true
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
            source_ref="${tag}"
          else
            tag="$(gh api repos/harborstremio/harbor/releases/latest --jq '.tag_name')"
            source_ref="${tag}"
          fi

          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "Could not resolve upstream tag" >&2
            exit 1
          fi

          if [ -z "${INPUT_SOURCE_REF}" ]; then
            version="${tag#v}"
            tag_commit="$(gh api "repos/harborstremio/harbor/git/ref/tags/${tag}" --jq '.object.sha')"
            compare_status="$(gh api "repos/harborstremio/harbor/compare/7eaf9d4...${tag_commit}" --jq '.status')"
            if echo "${compare_status}" | grep -Eq '^(identical|ahead)$'; then
              contains_linux_fix=true
            else
              echo "Upstream tag ${tag} does not contain Linux build fix 7eaf9d4; skipping."
              contains_linux_fix=false
            fi
          fi

          case "${INPUT_CHANNEL}" in
            stable)
              aur_package=harbor-stremio-bin
              ;;
            beta)
              aur_package=harbor-stremio-beta-bin
              ;;
            *)
              echo "Unsupported package channel: ${INPUT_CHANNEL}" >&2
              exit 1
              ;;
          esac

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "channel=${INPUT_CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "aur_package=${aur_package}" >> "${GITHUB_OUTPUT}"
          echo "contains_linux_fix=${contains_linux_fix}" >> "${GITHUB_OUTPUT}"

      - name: Check existing release
        id: check
        if: steps.resolve.outputs.contains_linux_fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Release ${TAG} already exists, but manual run will rebuild it."
              echo "should_build=true" >> "${GITHUB_OUTPUT}"
            else
              echo "Release ${TAG} already exists; nothing to do."
              echo "should_build=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build Linux bundles
    needs: resolve
    if: needs.resolve.outputs.contains_linux_fix == 'true' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Harbor build
        uses: ./.github/actions/setup-harbor-linux
        with:
          source_ref: ${{ needs.resolve.outputs.source_ref }}
          include_rpm_tooling: "true"

      - name: Disable updater artifacts
        working-directory: harbor
        run: |
          node -e '
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          '

      - name: Build Debian bundle
        working-directory: harbor
        run: pnpm tauri build --config src-tauri/tauri.linux-system.conf.json --target x86_64-unknown-linux-gnu --bundles deb

      - name: Build RPM bundle
        working-directory: harbor
        run: pnpm tauri build --config src-tauri/tauri.linux-system.conf.json --target x86_64-unknown-linux-gnu --bundles rpm

      # AppImage builds are intentionally disabled for now.
      # - name: Build AppImage bundle
      #   working-directory: harbor
      #   env:
      #     NO_STRIP: "true"
      #   run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Validate Linux library ABI
        run: |
          set -euo pipefail

          deb="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -type f -name '*.deb' | head -n 1)"
          if [ -z "${deb}" ]; then
            echo "No Debian bundle was produced" >&2
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT
          dpkg-deb -x "${deb}" "${tmpdir}"

          readelf -d "${tmpdir}/usr/bin/harbor" | grep 'Shared library: \[libmpv.so.2\]'
          if readelf -d "${tmpdir}/usr/bin/harbor" | grep -q 'Shared library: \[libmpv.so.1\]'; then
            echo "Harbor is linked against libmpv.so.1; Arch mpv provides libmpv.so.2." >&2
            exit 1
          fi

      - name: Collect artifacts
        id: artifacts
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          deb="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -type f -name '*.deb' | head -n 1)"
          if [ -z "${deb}" ]; then
            echo "No Debian bundle was produced" >&2
            exit 1
          fi

          rpm="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm -type f -name '*.rpm' | head -n 1)"
          if [ -z "${rpm}" ]; then
            echo "No RPM bundle was produced" >&2
            exit 1
          fi

          deb_asset="Harbor_${VERSION}_amd64.deb"
          rpm_asset="Harbor-${VERSION}-1.x86_64.rpm"
          cp -v "${deb}" "dist/${deb_asset}"
          cp -v "${rpm}" "dist/${rpm_asset}"

          cd dist
          sha256sum * > "SHA256SUMS-${VERSION}.txt"
          deb_sha256="$(sha256sum "${deb_asset}" | awk '{print $1}')"
          echo "deb_asset=${deb_asset}" >> "${GITHUB_OUTPUT}"
          echo "deb_sha256=${deb_sha256}" >> "${GITHUB_OUTPUT}"
          ls -lh

      - name: Upload Linux bundles
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-bundles-${{ needs.resolve.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish Linux bundles
    needs: [resolve, build]
    if: needs.resolve.outputs.contains_linux_fix == 'true' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download Linux bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bundles-${{ needs.resolve.outputs.version }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --repo "${REPOSITORY}" --clobber
            exit 0
          fi
          notes="Unofficial ${CHANNEL} Linux build of Harbor.\n\nSource: https://github.com/harborstremio/harbor/tree/${SOURCE_REF}\n\nThese binaries are built by this repository's GitHub Actions workflow, not by upstream Harbor."
          if [ "${CHANNEL}" = beta ]; then
            gh release create "${TAG}" dist/* --repo "${REPOSITORY}" --title "Harbor Linux ${TAG}" --notes "${notes}" --prerelease
          else
            gh release create "${TAG}" dist/* --repo "${REPOSITORY}" --title "Harbor Linux ${TAG}" --notes "${notes}" --latest
          fi

      - name: Verify published Debian asset
        id: published_deb
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          DEB_ASSET: Harbor_${{ needs.resolve.outputs.version }}_amd64.deb
        run: |
          set -euo pipefail
          expected_sha256="$(sha256sum "dist/${DEB_ASSET}" | awk '{print $1}')"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern "${DEB_ASSET}" --dir "${tmpdir}"
          published_sha256="$(sha256sum "${tmpdir}/${DEB_ASSET}" | awk '{print $1}')"
          test "${published_sha256}" = "${expected_sha256}"
          echo "sha256=${published_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Update AUR package
        uses: ./.github/actions/publish-aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        with:
          version: ${{ needs.resolve.outputs.version }}
          tag: ${{ needs.resolve.outputs.tag }}
          channel: ${{ needs.resolve.outputs.channel }}
          package: ${{ needs.resolve.outputs.aur_package }}
          deb_asset: Harbor_${{ needs.resolve.outputs.version }}_amd64.deb
          deb_sha256: ${{ steps.published_deb.outputs.sha256 }}
          repository: ${{ github.repository }}

  flatpak:
    name: Build Flatpak bundle
    needs: [resolve, publish]
    if: needs.resolve.outputs.contains_linux_fix == 'true' && needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/build-flatpak.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      channel: ${{ needs.resolve.outputs.channel }}

  publish-flatpak:
    name: Publish Flatpak bundle
    needs: [resolve, publish, flatpak]
    if: needs.resolve.outputs.contains_linux_fix == 'true' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: harbor-release-assets-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download Flatpak bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-bundle-${{ needs.resolve.outputs.version }}
          path: dist

      - name: Download refreshed Flatpak sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-sources-${{ needs.resolve.outputs.version }}
          path: flatpak-artifact

      - name: Persist downstream Flatpak sources
        run: |
          set -euo pipefail
          rsync -a --delete flatpak-artifact/ flatpak/
          git add flatpak
          if git diff --cached --quiet; then
            echo "Downstream Flatpak sources are already current."
            exit 0
          fi
          git config user.name "Aditya Hebballe"
          git config user.email "45328110+AdityaHebballe@users.noreply.github.com"
          git commit -m "build(flatpak): sync ${{ needs.resolve.outputs.version }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish Flatpak bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          asset="Harbor_${VERSION}_x86_64.flatpak"
          checksums="SHA256SUMS-${VERSION}.txt"
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern "${checksums}" --dir dist
          tmpfile="$(mktemp)"
          trap 'rm -f "${tmpfile}"' EXIT
          grep -v -F "  ${asset}" "dist/${checksums}" > "${tmpfile}" || true
          sha256sum "dist/${asset}" >> "${tmpfile}"
          sort -k 2,2 "${tmpfile}" > "dist/${checksums}"
          gh release upload "${TAG}" dist/* --repo "${REPOSITORY}" --clobber

  appimage:
    name: Build experimental AppImage
    needs: [resolve, publish]
    if: needs.resolve.outputs.contains_linux_fix == 'true' && needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/build-appimage.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      channel: ${{ needs.resolve.outputs.channel }}

  publish-appimage:
    name: Publish experimental AppImage
    needs: [resolve, publish, appimage]
    if: needs.resolve.outputs.contains_linux_fix == 'true' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: harbor-release-assets-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage-${{ needs.resolve.outputs.version }}
          path: dist

      - name: Append AppImage checksums and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          checksums="SHA256SUMS-${VERSION}.txt"
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern "${checksums}" --dir dist

          tmpfile="$(mktemp)"
          trap 'rm -f "${tmpfile}"' EXIT
          grep -v -E '  Harbor_.*_amd64\.AppImage(\.zsync)?$' "dist/${checksums}" > "${tmpfile}" || true
          sha256sum dist/*.AppImage dist/*.AppImage.zsync >> "${tmpfile}"
          sort -k 2,2 "${tmpfile}" > "dist/${checksums}"

          gh release upload "${TAG}" \
            dist/*.AppImage \
            dist/*.AppImage.zsync \
            "dist/${checksums}" \
            --repo "${REPOSITORY}" \
            --clobber
