name: Build Harbor Linux Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream Harbor tag to build, for example v0.9.12. Leave empty for latest release.
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  # The shared workflow invokes reusable build workflows that declare optional
  # release-publish jobs, so GitHub requires this boundary to allow writes.
  contents: write

concurrency:
  group: harbor-linux-stable-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve upstream tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      aur_package: ${{ steps.resolve.outputs.aur_package }}
      contains_linux_fix: ${{ steps.resolve.outputs.contains_linux_fix }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="$(gh api repos/harborstremio/harbor/releases/latest --jq '.tag_name')"
          fi
          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "Could not resolve upstream tag" >&2
            exit 1
          fi
          source_ref="${tag}"
          version="${tag#v}"
          tag_commit="$(gh api "repos/harborstremio/harbor/git/ref/tags/${tag}" --jq '.object.sha')"
          compare_status="$(gh api "repos/harborstremio/harbor/compare/7eaf9d4...${tag_commit}" --jq '.status')"
          if echo "${compare_status}" | grep -Eq '^(identical|ahead)$'; then
            contains_linux_fix=true
          else
            echo "Upstream tag ${tag} does not contain Linux build fix 7eaf9d4; skipping."
            contains_linux_fix=false
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "source_ref=${source_ref}"
            echo "aur_package=harbor-stremio-bin"
            echo "contains_linux_fix=${contains_linux_fix}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check existing release
        id: check
        if: steps.resolve.outputs.contains_linux_fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Release ${TAG} already exists, but manual run will rebuild it."
              echo "should_build=true" >> "${GITHUB_OUTPUT}"
            else
              echo "Release ${TAG} already exists; nothing to do."
              echo "should_build=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  publish-channel:
    name: Build and publish stable Linux bundles
    needs: resolve
    if: needs.resolve.outputs.contains_linux_fix == 'true' && needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/publish-linux-channel.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      package_revision: "1"
      channel: stable
      aur_package: ${{ needs.resolve.outputs.aur_package }}
    secrets: inherit
