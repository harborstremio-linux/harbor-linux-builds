name: Build Harbor Linux Beta

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream beta ref or commit to build.
        required: true
        default: beta-branch
        type: string
      force_rebuild:
        description: Rebuild and republish even when this version already has a beta release.
        required: false
        default: false
        type: boolean
      target:
        description: Build target.
        required: true
        default: all
        type: choice
        options:
          - all
          - native
          - deb
          - rpm
          - flatpak
          - appimage
  schedule:
    - cron: "23 */5 * * *"

permissions:
  contents: write

concurrency:
  group: harbor-linux-beta-${{ inputs.ref || 'beta-branch' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve upstream beta commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      package_revision: ${{ steps.resolve.outputs.package_revision }}
      aur_package: ${{ steps.resolve.outputs.aur_package }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve beta commit and version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref || 'beta-branch' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          source_ref="$(gh api "repos/harborstremio/harbor/commits/${INPUT_REF}" --jq '.sha')"
          version="$(gh api "repos/harborstremio/harbor/contents/package.json?ref=${source_ref}" --jq '.content' | tr -d '\n' | base64 --decode | jq -r '.version')"
          compare_status="$(gh api "repos/harborstremio/harbor/compare/7eaf9d4...${source_ref}" --jq '.status')"

          if ! echo "${compare_status}" | grep -Eq '^(identical|ahead)$'; then
            echo "${INPUT_REF} does not contain Linux build fix 7eaf9d4." >&2
            exit 1
          fi

          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "Could not read the Harbor version from ${source_ref}." >&2
            exit 1
          fi

          # Reuse an existing versioned release even if it retains a legacy
          # commit-suffixed Git tag from before beta releases became version-based.
          existing_tag="$(gh release list --repo "${REPOSITORY}" --limit 100 --json name,tagName | jq -r --arg name "Harbor Linux beta-v${version}" '.[] | select(.name == $name) | .tagName' | head -n 1)"
          tag="${existing_tag:-beta-v${version}}"

          # Native repositories must receive a monotonically increasing
          # package revision.  APT/DNF do not upgrade an installed package
          # merely because an equal-version artifact was replaced upstream.
          package_revision=1
          if gh release view "${tag}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            previous_revision="$(gh release view "${tag}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name' | sed -nE "s#^Harbor_${version}-([0-9]+)_amd64\\.deb\$#\\1#p" | sort -n | tail -n 1)"
            # Releases published before package revisions used an unrevisioned
            # .deb; treat that as revision 1.
            package_revision="$(( ${previous_revision:-1} + 1 ))"
          fi

          {
            echo "source_ref=${source_ref}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "package_revision=${package_revision}"
            echo "aur_package=harbor-stremio-beta-bin"
          } >> "${GITHUB_OUTPUT}"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            if [ "${FORCE_REBUILD}" = true ] || [ "${TARGET}" != all ]; then
              echo "Release ${TAG} already exists, but this manual run will rebuild it."
              echo "should_build=true" >> "${GITHUB_OUTPUT}"
            else
              echo "Release ${TAG} already exists; nothing to do."
              echo "should_build=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  publish-channel:
    name: Build beta Linux bundles
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/publish-linux-channel.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      package_revision: ${{ needs.resolve.outputs.package_revision }}
      channel: beta
      aur_package: ${{ needs.resolve.outputs.aur_package }}
      target: ${{ inputs.target || 'all' }}
    secrets: inherit

  publish-cloudsmith:
    name: Publish beta Linux packages to Cloudsmith
    needs: [resolve, publish-channel]
    if: needs.publish-channel.result == 'success' && ((inputs.target || 'all') == 'all' || (inputs.target || 'all') == 'native' || (inputs.target || 'all') == 'deb' || (inputs.target || 'all') == 'rpm')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download Linux bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bundles-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.package_revision }}
          path: dist

      - name: Verify Debian package checksum
        if: inputs.target != 'rpm'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PACKAGE_REVISION: ${{ needs.resolve.outputs.package_revision }}
        run: |
          set -euo pipefail
          asset="Harbor_${VERSION}-${PACKAGE_REVISION}_amd64.deb"
          checksums="SHA256SUMS-${VERSION}.txt"
          (
            cd dist
            grep -F "  ${asset}" "${checksums}" | sha256sum --check --strict
          )

      - name: Verify RPM package checksum
        if: inputs.target != 'deb'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PACKAGE_REVISION: ${{ needs.resolve.outputs.package_revision }}
        run: |
          set -euo pipefail
          asset="Harbor-${VERSION}-${PACKAGE_REVISION}.x86_64.rpm"
          checksums="SHA256SUMS-${VERSION}.txt"
          (
            cd dist
            grep -F "  ${asset}" "${checksums}" | sha256sum --check --strict
          )

      - name: Install Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@db783de9f6e7a445e5e31d94f4210303b48a10a3 # v3.0.1
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          cli-version: 1.8.3

      - name: Publish verified Debian package
        if: inputs.target != 'rpm'
        env:
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_BETA_REPOSITORY }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PACKAGE_REVISION: ${{ needs.resolve.outputs.package_revision }}
        run: |
          set -euo pipefail
          test -n "${CLOUDSMITH_REPOSITORY}"
          cloudsmith push deb "${CLOUDSMITH_REPOSITORY}/ubuntu/noble" \
            "dist/Harbor_${VERSION}-${PACKAGE_REVISION}_amd64.deb" \
            --tags beta

      - name: Publish verified RPM package
        if: inputs.target != 'deb'
        env:
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_BETA_REPOSITORY }}
          RPM_DISTRIBUTION: ${{ vars.CLOUDSMITH_BETA_RPM_DISTRIBUTION || 'fedora/44' }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PACKAGE_REVISION: ${{ needs.resolve.outputs.package_revision }}
        run: |
          set -euo pipefail
          test -n "${CLOUDSMITH_REPOSITORY}"
          test -n "${RPM_DISTRIBUTION}"
          cloudsmith push rpm "${CLOUDSMITH_REPOSITORY}/${RPM_DISTRIBUTION}" \
            "dist/Harbor-${VERSION}-${PACKAGE_REVISION}.x86_64.rpm" \
            --tags beta

  update-readme:
    name: Update primary beta download links
    needs: [resolve, publish-channel]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update beta release links
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "No beta release was published; README unchanged."
            exit 0
          fi

          node <<'EOF'
          const fs = require("node:fs");

          const readmePath = "README.md";
          const releaseUrl = `https://github.com/${process.env.REPOSITORY}/releases/tag/${process.env.TAG}`;
          const readme = fs.readFileSync(readmePath, "utf8");
          const repositoryPattern = process.env.REPOSITORY.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const linkPattern = new RegExp(
            `https://github\\.com/${repositoryPattern}/releases/tag/beta-v[^)"\\s<]+`,
            "g",
          );

          if (!linkPattern.test(readme)) {
            throw new Error("No primary beta release links found in README.md");
          }

          const updatedReadme = readme.replace(linkPattern, releaseUrl);
          fs.writeFileSync(readmePath, updatedReadme);
          EOF

          if git diff --quiet -- README.md; then
            echo "README beta link is already current."
            exit 0
          fi

          git config user.name "Aditya Hebballe"
          git config user.email "45328110+AdityaHebballe@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update beta release link"
          git pull --rebase origin main
          git push origin HEAD:main
